<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Join links redirect before anything renders, so invitees never see "Page Not Found".
        (function () {
            var m = window.location.pathname.match(/^\/join\/([A-Za-z0-9]+)\/?$/);
            if (m) window.location.replace('/join/?code=' + encodeURIComponent(m[1]));
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-itunes-app" content="app-id=6749215322">
    <title>Page Not Found - Kopare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon {
            display: block;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            color: #667eea;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            vertical-align: -3px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
            color: #718096;
        }

        .path {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #4a5568;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <div class="path" id="currentPath"></div>
        <p>You might be looking for:</p>
        <a href="https://kopare.app" class="btn">Kopare Home</a>
        <a href="https://apps.apple.com/us/app/kopare/id6749215322" class="btn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09z"/></svg>
            Download on the App Store
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.kopare.app" class="btn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3.6v16.8a1 1 0 0 0 1.5.86l13.7-8.4a1 1 0 0 0 0-1.72L7.5 2.74A1 1 0 0 0 6 3.6z"/></svg>
            Get it on Google Play
        </a>

        <div class="footer">
            <a href="https://kopare.app" style="color: #667eea; text-decoration: none;">kopare.app</a> •
            <a href="https://kopare.app/privacy-policy.html" style="color: #667eea; text-decoration: none;">Privacy Policy</a>
        </div>
    </div>

    <script>
        // Show current path
        document.getElementById('currentPath').textContent = window.location.pathname;

    </script>
</body>
</html>

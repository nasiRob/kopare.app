<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-itunes-app" content="app-id=6749215322">
    <title>Page Not Found - Kopare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
            color: #718096;
        }

        .path {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #4a5568;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <div class="path" id="currentPath"></div>
        <p>You might be looking for:</p>
        <a href="https://kopare.app" class="btn">Kopare Home</a>
        <a href="https://apps.apple.com/app/kopare/id6749215322" class="btn">Download App</a>

        <div class="footer">
            <a href="https://kopare.app" style="color: #667eea; text-decoration: none;">kopare.app</a> •
            <a href="https://kopare.app/privacy-policy.html" style="color: #667eea; text-decoration: none;">Privacy Policy</a>
        </div>
    </div>

    <script>
        // Show current path
        document.getElementById('currentPath').textContent = window.location.pathname;

        // Check if this is a join link that wasn't handled
        const path = window.location.pathname;
        const joinMatch = path.match(/\/join\/([A-Z0-9]+)/i);

        if (joinMatch) {
            // This is a join link - redirect to the proper handler without changing the URL pattern
            const inviteCode = joinMatch[1];

            // Try to open the app directly
            const appUrl = `kopare://join/${inviteCode}`;
            window.location.href = appUrl;

            // If app doesn't open, redirect to join page after a short delay
            setTimeout(() => {
                window.location.href = `/join/?code=${inviteCode}`;
            }, 1500);
        }
    </script>
</body>
</html>

<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone mockup background -->
  <rect x="50" y="20" width="400" height="560" rx="40" fill="#2C5364"/>
  <rect x="70" y="40" width="360" height="520" rx="20" fill="#F0F5F7"/>

  <!-- Status bar -->
  <rect x="70" y="40" width="360" height="40" fill="#C4D7E0"/>
  <text x="100" y="65" font-family="Arial" font-size="14" fill="#2C5364">9:41</text>

  <!-- App header -->
  <rect x="70" y="80" width="360" height="60" fill="#FFFFFF"/>
  <circle cx="90" cy="110" r="8" fill="#FF9B8A"/>
  <circle cx="105" cy="110" r="8" fill="#FF9B8A"/>
  <text x="130" y="118" font-family="Arial" font-size="20" font-weight="bold" fill="#2C5364">kopare</text>

  <!-- Calendar representation -->
  <g transform="translate(90, 150)">
    <rect width="320" height="300" rx="10" fill="#FFFFFF"/>
    <text x="10" y="30" font-family="Arial" font-size="18" fill="#2C5364">January 2026</text>

    <!-- Calendar grid -->
    <g transform="translate(10, 50)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#4A90E2"/>
      <rect x="50" y="0" width="40" height="40" rx="5" fill="#4A90E2"/>
      <rect x="100" y="0" width="40" height="40" rx="5" fill="#4A90E2"/>
      <rect x="150" y="0" width="40" height="40" rx="5" fill="#C4D7E0"/>
      <rect x="200" y="0" width="40" height="40" rx="5" fill="#C4D7E0"/>
      <rect x="250" y="0" width="40" height="40" rx="5" fill="#5CB85C"/>

      <rect x="0" y="50" width="40" height="40" rx="5" fill="#4A90E2"/>
      <rect x="50" y="50" width="40" height="40" rx="5" fill="#4A90E2"/>
      <rect x="100" y="50" width="40" height="40" rx="5" fill="#C4D7E0"/>
    </g>

    <!-- Events list -->
    <g transform="translate(10, 180)">
      <rect width="300" height="50" rx="8" fill="#FFE5E0"/>
      <circle cx="20" cy="25" r="8" fill="#FF9B8A"/>
      <text x="40" y="20" font-family="Arial" font-size="12" fill="#2C5364">Soccer Game</text>
      <text x="40" y="35" font-family="Arial" font-size="10" fill="#5A6C7D">Jan 17, 12:00 PM</text>
    </g>
  </g>

  <!-- Bottom tab bar -->
  <rect x="70" y="520" width="360" height="40" rx="10" fill="#FFFFFF"/>
  <text x="95" y="545" font-family="Arial" font-size="12" fill="#4A90E2">Calendar</text>
  <text x="180" y="545" font-family="Arial" font-size="12" fill="#5A6C7D">Messages</text>
  <text x="270" y="545" font-family="Arial" font-size="12" fill="#5A6C7D">Expenses</text>
  <text x="360" y="545" font-family="Arial" font-size="12" fill="#5A6C7D">Settings</text>
</svg>

<svg width="300" height="650" viewBox="0 0 300 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone frame -->
  <rect width="300" height="650" rx="30" fill="#C4D7E0"/>

  <!-- Screen -->
  <rect x="10" y="10" width="280" height="630" rx="25" fill="#F0F5F7"/>

  <!-- Status bar -->
  <text x="30" y="35" font-family="Arial" font-size="12" fill="#2C5364">8:55</text>

  <!-- Header -->
  <text x="30" y="80" font-family="Arial" font-size="24" font-weight="bold" fill="#2C5364">January 2026</text>

  <!-- Calendar grid -->
  <g transform="translate(30, 110)">
    <text y="20" font-family="Arial" font-size="10" fill="#999">SUN MON TUE WED THU FRI SAT</text>

    <!-- Week 1 -->
    <g transform="translate(0, 40)">
      <circle cx="115" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="155" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="195" cy="10" r="6" fill="#5CB85C"/>
    </g>

    <!-- Week 2 -->
    <g transform="translate(0, 70)">
      <circle cx="15" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="55" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="115" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="155" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="195" cy="10" r="6" fill="#4A90E2"/>
      <circle cx="235" cy="10" r="6" fill="#5CB85C"/>
    </g>
  </g>

  <!-- Events -->
  <g transform="translate(20, 320)">
    <text y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#2C5364">Events</text>

    <rect y="20" width="260" height="70" rx="10" fill="#FFFFFF"/>
    <circle cx="30" cy="55" r="12" fill="#E0F0FF"/>
    <text x="50" y="45" font-family="Arial" font-size="14" fill="#2C5364">Dad's standard weekend</text>
    <text x="50" y="65" font-family="Arial" font-size="11" fill="#5A6C7D">January 16, 12:00 PM - January 19, 3:00 PM</text>

    <rect y="100" width="260" height="70" rx="10" fill="#FFFFFF"/>
    <circle cx="30" cy="135" r="12" fill="#D4EDDA"/>
    <text x="50" y="125" font-family="Arial" font-size="14" fill="#2C5364">Soccer Game</text>
    <text x="50" y="145" font-family="Arial" font-size="11" fill="#5A6C7D">January 17, 12:00 PM - 3:00 PM</text>
    <text x="240" cy="135" font-family="Arial" font-size="10" fill="#5CB85C">👥</text>
  </g>

  <!-- Bottom nav -->
  <g transform="translate(0, 600)">
    <rect x="20" y="0" width="260" height="50" rx="25" fill="#FFFFFF"/>
    <text x="45" y="30" font-family="Arial" font-size="11" fill="#4A90E2" font-weight="bold">Calendar</text>
    <text x="115" y="30" font-family="Arial" font-size="11" fill="#5A6C7D">Messages</text>
    <text x="185" y="30" font-family="Arial" font-size="11" fill="#5A6C7D">Expenses</text>
  </g>
</svg>

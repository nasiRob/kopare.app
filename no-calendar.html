<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kopare - Create your shared custody calendar">
    <meta name="apple-itunes-app" content="app-id=6749215322">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kopare">
    <title>Kopare - Get Started</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="container">
                <div class="logo">
                    <img src="assets/logo.png" alt="Kopare Logo">
                </div>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div class="nav-tabs">
                        <a href="index.html" class="nav-tab">Kopare</a>
                        <a href="koparent-bingo.html" class="nav-tab">Koparent Bingo</a>
                    </div>
                    <a href="https://apps.apple.com/us/app/kopare/id6749215322" class="cta-button-nav">Download App</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="no-calendar-view">
            <div class="no-calendar-content">
                <!-- Animated calendar icon with pulse ring -->
                <div class="no-calendar-icon-wrapper">
                    <div class="no-calendar-pulse-ring"></div>
                    <div class="no-calendar-pulse-ring no-calendar-pulse-ring--delay"></div>
                    <div class="no-calendar-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
                            <!-- Calendar body -->
                            <rect x="8" y="16" width="64" height="56" rx="8" fill="white" stroke="#2C5364" stroke-width="3"/>
                            <!-- Calendar top bar -->
                            <rect x="8" y="16" width="64" height="18" rx="8" fill="#2C5364"/>
                            <rect x="8" y="26" width="64" height="8" fill="#2C5364"/>
                            <!-- Calendar rings -->
                            <rect x="24" y="10" width="4" height="14" rx="2" fill="#2C5364"/>
                            <rect x="52" y="10" width="4" height="14" rx="2" fill="#2C5364"/>
                            <!-- Calendar grid dots -->
                            <circle cx="24" cy="46" r="3" fill="#C4D7E0"/>
                            <circle cx="40" cy="46" r="3" fill="#C4D7E0"/>
                            <circle cx="56" cy="46" r="3" fill="#C4D7E0"/>
                            <circle cx="24" cy="60" r="3" fill="#C4D7E0"/>
                            <circle cx="40" cy="60" r="3" fill="#FF9B8A"/>
                            <circle cx="56" cy="60" r="3" fill="#C4D7E0"/>
                            <!-- Plus icon -->
                            <circle cx="58" cy="58" r="12" fill="#FF9B8A"/>
                            <rect x="53" y="56.5" width="10" height="3" rx="1.5" fill="white"/>
                            <rect x="56.5" y="53" width="3" height="10" rx="1.5" fill="white"/>
                        </svg>
                    </div>
                </div>

                <!-- Text content -->
                <h1 class="no-calendar-title">Get started with your calendar</h1>
                <p class="no-calendar-subtitle">You can set things up privately first. Invite the other parent later.</p>

                <!-- Primary CTA button -->
                <button class="no-calendar-cta" onclick="window.location.href='https://apps.apple.com/us/app/kopare/id6749215322'">
                    <svg class="no-calendar-cta-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                        <line x1="12" y1="14" x2="12" y2="18"/>
                        <line x1="10" y1="16" x2="14" y2="16"/>
                    </svg>
                    Create Calendar
                </button>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Kopare. All rights reserved.</p>
            <p><a href="privacy-policy.html">Privacy Policy</a> | <a href="koparent-bingo.html">Koparent Bingo</a></p>
        </div>
    </footer>
</body>
</html>

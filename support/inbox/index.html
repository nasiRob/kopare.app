<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kopare Support Inbox</title>
<link rel="icon" href="../../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../support.css">
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="brand"><img src="../../assets/logo.png" alt="">Kopare Support</div>
    <h1 id="gateTitle">Inbox</h1>
    <p id="gateText">Loading…</p>
    <button class="btn pri" id="gateBtn" type="button" hidden></button>
    <div class="err" id="gateErr" role="alert" hidden></div>
  </div>
</div>

<div class="admin" id="admin" hidden>
  <section class="list" aria-label="Chats">
    <div class="list-h"><b>Inbox</b>
      <button class="toggle" id="onlineToggle" type="button" aria-pressed="false"><span class="dot off"></span><span id="onlineLabel">Away</span></button>
    </div>
    <div class="filters" id="filters">
      <button type="button" data-f="open" aria-pressed="true">Open</button>
      <button type="button" data-f="waiting" aria-pressed="false">Waiting</button>
      <button type="button" data-f="closed" aria-pressed="false">Closed</button>
    </div>
    <div class="convs" id="convs"></div>
    <div style="padding:10px 14px;border-top:1px solid var(--hair);font-size:12.5px"><button class="btn sec" id="signOutBtn" type="button">Sign out</button></div>
  </section>

  <section class="thread" id="thread" aria-label="Conversation">
    <div class="placeholder" id="noSel">Select a chat to read it.</div>
    <div id="threadWrap" style="display:contents" hidden>
      <div class="thread-h">
        <button class="back" id="backBtn" type="button" aria-label="Back to chats"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="m15 18-6-6 6-6"/></svg></button>
        <b id="thName"></b><small id="thMeta"></small>
        <span class="tag blk" id="thPaused" style="margin:0" hidden></span>
        <div class="actions"><button class="btn sec" id="blockBtn" type="button">Block</button><button class="btn sec" id="closeBtn" type="button">Close chat</button></div>
      </div>
      <details class="acct-m" id="acctM"><summary id="acctSum">Account</summary><div class="acct-m-body" id="acctMBody"></div></details>
      <div id="flagM"></div>
      <div class="t-body">
        <div class="t-msgs" id="tMsgs" role="log"></div>
        <aside class="acct" id="acct" aria-label="Account"></aside>
      </div>
      <div class="reply">
        <div class="canned" id="canned"></div>
        <div id="replyErr" class="sys err" role="alert" hidden></div>
        <form class="field" id="replyForm" autocomplete="off">
          <textarea id="replyInput" rows="1" placeholder="Reply…" aria-label="Reply" maxlength="2000"></textarea>
          <button class="send" type="submit" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </form>
      </div>
    </div>
  </section>
</div>
<script type="module" src="inbox.js?v=3"></script>
</body>
</html>
